name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  pine-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      # Runs first so a silently broken linter cannot pass CI forever.
      - name: Linter selftest
        run: python3 tools/pine_lint.py --selftest

      - name: Lint Pine sources
        run: python3 tools/pine_lint.py pine/*.pine

      - name: Summary
        if: always()
        run: |
          {
            echo "### Pine lint"
            echo
            echo "| file | lines |"
            echo "|---|---|"
            for f in pine/*.pine; do
              echo "| \`$f\` | $(wc -l < "$f") |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

  # Independent second gate: actually transpile every source instead of only
  # pattern-matching it. The linter is structural and cannot see type or scope
  # errors; PineTS resolves every identifier, so an undeclared name fails the
  # build here. Kept as a separate job because `npm ci` needs the network while
  # the linter is pure stdlib — if npm is down, linting still runs.
  pine-transpile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: tools/package-lock.json

      - name: Install PineTS
        run: npm ci --prefix tools

      - name: Transpile Pine sources
        run: node tools/pine_compile.mjs pine/*.pine

      - name: Summary
        if: always()
        run: |
          {
            echo "### Pine transpile (PineTS)"
            echo
            echo "Offline pre-check. TradingView's compiler stays authoritative —"
            echo "PineTS accepts alertcondition string concat and \`var bool x = na\`,"
            echo "which the linter job enforces instead."
          } >> "$GITHUB_STEP_SUMMARY"
